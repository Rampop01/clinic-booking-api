services:
  - type: web
    name: clinic-booking-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: API_KEY
        sync: false   # set a value of your choice in the Render dashboard
      - key: DATABASE_URL
        sync: false   # paste your Neon / Supabase / Render Postgres connection string

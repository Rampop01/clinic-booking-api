<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clinic Booking — pick a slot, get confirmed</title>
  <meta name="description" content="Book a clinic appointment: see available slots, reserve one and get an instant confirmation.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:hsl(222 47% 8%);--card:hsl(222 40% 12%);--line:hsl(222 30% 22%);
      --text:hsl(210 40% 96%);--muted:hsl(215 20% 66%);
      --brand:hsl(168 84% 48%);--brand-2:hsl(199 92% 58%);--danger:hsl(0 84% 66%);--ok:hsl(142 72% 55%);
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Outfit,system-ui,sans-serif;color:var(--text);min-height:100vh;
      background:radial-gradient(900px 500px at 10% -10%,hsl(168 80% 30% / .35),transparent 60%),
                 radial-gradient(800px 500px at 100% 0,hsl(199 90% 40% / .30),transparent 60%),var(--bg)}
    main{max-width:960px;margin:0 auto;padding:40px 20px 80px}
    h1{font-size:clamp(28px,5vw,44px);margin:0 0 6px;letter-spacing:-.02em;
      background:linear-gradient(90deg,var(--brand),var(--brand-2));-webkit-background-clip:text;background-clip:text;color:transparent}
    .sub{color:var(--muted);margin:0 0 28px}
    .panel{background:color-mix(in srgb,var(--card) 85%,transparent);backdrop-filter:blur(10px);
      border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:20px}
    .row{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
    label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);flex:1;min-width:180px}
    input{background:hsl(222 40% 9%);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px 12px;font:inherit}
    input:focus{outline:2px solid var(--brand);outline-offset:1px}
    button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:11px 18px;cursor:pointer;color:hsl(222 47% 8%);
      background:linear-gradient(90deg,var(--brand),var(--brand-2));transition:transform .15s,filter .15s}
    button:hover{transform:translateY(-1px);filter:brightness(1.08)}
    button:disabled{opacity:.5;cursor:not-allowed;transform:none}
    button.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
    h2{font-size:18px;margin:0 0 14px}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
    .slot{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;
      background:hsl(222 40% 10%);transition:border-color .15s,transform .15s;animation:in .35s both}
    .slot.sel{border-color:var(--brand);box-shadow:0 0 0 3px hsl(168 84% 48% / .18)}
    .slot.taken{opacity:.45}
    .slot strong{font-size:16px}
    .slot small{color:var(--muted)}
    .tag{align-self:flex-start;font-size:12px;border-radius:999px;padding:3px 10px;border:1px solid var(--line)}
    .tag.free{color:var(--ok);border-color:hsl(142 72% 55% / .5)}
    .tag.no{color:var(--danger);border-color:hsl(0 84% 66% / .5)}
    .msg{border-radius:12px;padding:12px 14px;margin-top:12px;font-size:14px}
    .msg.err{background:hsl(0 84% 66% / .12);border:1px solid hsl(0 84% 66% / .4)}
    .msg.ok{background:hsl(142 72% 55% / .12);border:1px solid hsl(142 72% 55% / .4)}
    .confirm dl{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;margin:10px 0 0}
    .confirm dt{color:var(--muted)} .confirm dd{margin:0;word-break:break-all}
    @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
<main>
  <header>
    <h1>Clinic Booking</h1>
    <p class="sub">See open appointment slots, book one, and get your confirmation instantly.</p>
  </header>

  <section class="panel" aria-labelledby="who">
    <h2 id="who">1 · Your details</h2>
    <div class="row">
      <label>API key<input id="apiKey" type="password" placeholder="X-API-Key" autocomplete="off"></label>
      <label>Full name<input id="name" type="text" placeholder="Ada Obi" autocomplete="name"></label>
      <label>Email<input id="email" type="email" placeholder="ada@example.com" autocomplete="email"></label>
    </div>
  </section>

  <section class="panel" aria-labelledby="slotsH">
    <div class="row" style="justify-content:space-between;align-items:center">
      <h2 id="slotsH" style="margin:0">2 · Pick a slot</h2>
      <button id="refresh" class="ghost" type="button">Refresh slots</button>
    </div>
    <div id="slots" class="grid" style="margin-top:14px" aria-live="polite"></div>
    <div id="slotMsg"></div>
  </section>

  <section class="panel" aria-labelledby="bookH">
    <h2 id="bookH">3 · Confirm</h2>
    <div class="row">
      <button id="book" type="button" disabled>Book selected slot</button>
      <button id="mine" class="ghost" type="button">Show my bookings</button>
    </div>
    <div id="result" aria-live="polite"></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let selected = null;
const fmt = (iso) => new Date(iso).toLocaleString([], { dateStyle: "medium", timeStyle: "short" });
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

$("apiKey").value = localStorage.getItem("clinicKey") || "";
$("name").value = localStorage.getItem("clinicName") || "";
$("email").value = localStorage.getItem("clinicEmail") || "";

function headers(extra) {
  const k = $("apiKey").value.trim();
  localStorage.setItem("clinicKey", k);
  return Object.assign({ "X-API-Key": k, "Content-Type": "application/json" }, extra || {});
}

async function api(path, opts) {
  const res = await fetch(path, opts);
  let body = null;
  try { body = await res.json(); } catch (_) {}
  return { status: res.status, body, res };
}

async function loadSlots() {
  $("slotMsg").innerHTML = "";
  const { status, body } = await api("/slots", { headers: headers() });
  if (status !== 200) {
    $("slots").innerHTML = "";
    $("slotMsg").innerHTML = `<div class="msg err">${esc((body && body.error) || "Could not load slots")} (${status})</div>`;
    return;
  }
  if (!body.slots.length) { $("slots").innerHTML = '<p class="sub">No slots yet.</p>'; return; }
  $("slots").innerHTML = body.slots.map((s, i) => `
    <button type="button" class="slot ${s.available ? "" : "taken"} ${selected === s.id ? "sel" : ""}"
      data-id="${esc(s.id)}" ${s.available ? "" : "disabled"} style="animation-delay:${i * 30}ms;text-align:left;color:inherit">
      <strong>${esc(s.provider)}</strong>
      <small>${fmt(s.start)} – ${new Date(s.end).toLocaleTimeString([], { timeStyle: "short" })}</small>
      <span class="tag ${s.available ? "free" : "no"}">${s.available ? "Available" : "Booked"}</span>
    </button>`).join("");
  document.querySelectorAll(".slot:not(.taken)").forEach((el) => el.addEventListener("click", () => {
    selected = el.dataset.id; $("book").disabled = false; loadSlots();
  }));
}

$("book").addEventListener("click", async () => {
  const name = $("name").value, email = $("email").value;
  localStorage.setItem("clinicName", name); localStorage.setItem("clinicEmail", email);
  $("book").disabled = true;
  // A fresh Idempotency-Key per click means an accidental double-click can't double-book.
  const key = (crypto.randomUUID && crypto.randomUUID()) || String(Date.now());
  const { status, body, res } = await api("/bookings", {
    method: "POST", headers: headers({ "Idempotency-Key": key }),
    body: JSON.stringify({ slot_id: selected, name, email }),
  });
  if (status === 201) {
    $("result").innerHTML = `<div class="msg ok confirm"><strong>Booking confirmed ✓</strong>
      <dl><dt>Booking ID</dt><dd>${esc(body.id)}</dd><dt>Name</dt><dd>${esc(body.name)}</dd>
      <dt>Email</dt><dd>${esc(body.email)}</dd><dt>Slot</dt><dd>${esc(body.slot_id)}</dd>
      <dt>Status</dt><dd>${esc(body.status)}</dd><dt>Booked at</dt><dd>${fmt(body.created_at)}</dd></dl>
      <p><button id="cancel" class="ghost" type="button" data-id="${esc(body.id)}">Cancel this booking</button></p></div>`;
    selected = null;
    $("cancel").addEventListener("click", cancelBooking);
    loadSlots();
  } else {
    const wait = res.headers.get("Retry-After");
    $("result").innerHTML = `<div class="msg err">${esc((body && body.error) || "Booking failed")} (${status})${wait ? ` — try again in ${esc(wait)}s` : ""}</div>`;
    $("book").disabled = !selected;
    if (status === 409) loadSlots();
  }
});

async function cancelBooking(e) {
  const id = e.target.dataset.id;
  const { status, body } = await api("/bookings/" + encodeURIComponent(id), { method: "DELETE", headers: headers() });
  $("result").innerHTML = status === 200
    ? `<div class="msg ok">Booking ${esc(id)} cancelled. The slot is free again.</div>`
    : `<div class="msg err">${esc((body && body.error) || "Could not cancel")} (${status})</div>`;
  loadSlots();
}

$("mine").addEventListener("click", async () => {
  const email = $("email").value.trim();
  if (!email) { $("result").innerHTML = '<div class="msg err">Enter your email first.</div>'; return; }
  const { status, body } = await api("/bookings?limit=50&email=" + encodeURIComponent(email), { headers: headers() });
  if (status !== 200) { $("result").innerHTML = `<div class="msg err">${esc((body && body.error) || "Failed")} (${status})</div>`; return; }
  $("result").innerHTML = body.bookings.length
    ? `<div class="msg ok"><strong>Your bookings</strong><ul>${body.bookings.map((b) =>
        `<li>${esc(b.id.slice(0, 8))}… · slot ${esc(b.slot_id)} · ${esc(b.status)} · ${fmt(b.created_at)}</li>`).join("")}</ul></div>`
    : '<div class="msg ok">No bookings yet.</div>';
});

$("refresh").addEventListener("click", loadSlots);
$("apiKey").addEventListener("change", loadSlots);
if ($("apiKey").value) loadSlots();
</script>
</body>
</html>
